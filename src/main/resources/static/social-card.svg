<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Durak Online</title>
  <desc id="description">Play the Durak card game online with friends or a bot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8e8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="100%" cy="0" r="90%">
      <stop offset="0" stop-color="#ead9bd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ead9bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cardPattern" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9 9 0l9 9-9 9Z" fill="none" stroke="#f2bdc7" stroke-opacity="0.34" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#2b2620" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="55" y="55" width="1090" height="520" rx="34" fill="#ffffff" fill-opacity="0.72" stroke="#2b2620" stroke-opacity="0.14" stroke-width="2"/>

  <g transform="translate(120 150)" filter="url(#shadow)">
    <g transform="rotate(-13 105 150)">
      <rect x="20" y="18" width="180" height="270" rx="18" fill="#8b1a2d" stroke="#5e1020" stroke-width="4"/>
      <rect x="30" y="28" width="160" height="250" rx="13" fill="url(#cardPattern)"/>
    </g>
    <g transform="translate(90 -12) rotate(-2 105 150)">
      <rect x="20" y="18" width="180" height="270" rx="18" fill="#941d31" stroke="#5e1020" stroke-width="4"/>
      <rect x="30" y="28" width="160" height="250" rx="13" fill="url(#cardPattern)"/>
    </g>
    <g transform="translate(180 15) rotate(11 105 150)">
      <rect x="20" y="18" width="180" height="270" rx="18" fill="#86172a" stroke="#5e1020" stroke-width="4"/>
      <rect x="30" y="28" width="160" height="250" rx="13" fill="url(#cardPattern)"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="555" y="230" fill="#2b2620" font-size="76" font-weight="800" letter-spacing="3">Durak</text>
    <text x="825" y="230" fill="#b9863a" font-size="76" font-weight="800" letter-spacing="3">Дурак</text>
    <text x="558" y="292" fill="#6b6359" font-size="29">Card shedding game</text>
    <text x="558" y="365" fill="#3a7d4f" font-size="26" font-weight="700">2–4 players</text>
    <text x="558" y="410" fill="#6b6359" font-size="25">Friends · private rooms · bots</text>
    <text x="558" y="482" fill="#b9863a" font-size="34" letter-spacing="16">♠ ♥ ♦ ♣</text>
  </g>
</svg>
