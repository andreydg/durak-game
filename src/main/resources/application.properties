spring.application.name=durak-game

# Render (and other PaaS) inject PORT; local default stays 8080
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Actuator: expose only health publicly (no detail leak on this unauthenticated app).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Firestore database id for Cloud Run persistence ("(default)" unless explicitly changed).
app.firestore.database-id=${FIRESTORE_DATABASE_ID:(default)}

# Activity-based room expiry. Firestore TTL cleans storage later; API reads and lobby
# listings enforce these deadlines synchronously.
app.expiry.lobby-idle-minutes=${LOBBY_IDLE_MINUTES:30}
app.expiry.lobby-max-age-minutes=${LOBBY_MAX_AGE_MINUTES:120}
app.expiry.active-idle-hours=${ACTIVE_GAME_IDLE_HOURS:24}
app.expiry.finished-retention-minutes=${FINISHED_GAME_RETENTION_MINUTES:60}
app.reaper.interval-ms=${GAME_REAPER_INTERVAL_MS:60000}

# Auto-play (primary LLM)
autoplay.request-timeout-ms=${AUTOPLAY_REQUEST_TIMEOUT_MS:30000}
autoplay.gemini.enabled=${AUTOPLAY_GEMINI_ENABLED:true}
autoplay.gemini.base-url=${AUTOPLAY_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
autoplay.gemini.model=${AUTOPLAY_GEMINI_MODEL:gemini-3.1-flash-lite-preview}
autoplay.gemini.thinking-level=${AUTOPLAY_GEMINI_THINKING_LEVEL:HIGH}
autoplay.gemini.reasoning-budget-seconds=${AUTOPLAY_GEMINI_REASONING_BUDGET_SECONDS:30}
autoplay.gemini.public-card-memory-enabled=${AUTOPLAY_GEMINI_PUBLIC_CARD_MEMORY_ENABLED:true}
autoplay.gemini.api-key=${GEMINI_API_KEY:}
# Model capability overrides: auto (derive from model name), true, or false.
autoplay.gemini.json-mode=${AUTOPLAY_GEMINI_JSON_MODE:auto}
autoplay.gemini.system-instruction=${AUTOPLAY_GEMINI_SYSTEM_INSTRUCTION:auto}
autoplay.gemini.thinking-config=${AUTOPLAY_GEMINI_THINKING_CONFIG:auto}
autoplay.gemini.prompt-reasoning-budget=${AUTOPLAY_GEMINI_PROMPT_REASONING_BUDGET:auto}

# Blocking bot turns (LLM calls + pacing pauses) run on virtual threads.
spring.threads.virtual.enabled=true
