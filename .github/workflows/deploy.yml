name: Deploy

# Releases main to Cloud Run once CI has passed for that exact commit. Releases run one at a time,
# in arrival order, and none replaces another that is waiting. Before touching Google Cloud, and
# again before deploying, scripts/release-gate.sh stops a release whose commit is no longer the head
# of main or has no successful CI run, so an older build can never replace a newer one.
# Setup: scripts/setup-github-deploy.sh (see README "Releases").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redeploys the head of main, for example after fixing the setup. Gated on that commit's CI run
  # like the automatic path, so it can't release a commit whose tests are still running or failed.
  workflow_dispatch:

# With GitHub's default queue a group holds one waiting run, and a newer arrival cancels it: a re-run
# of an older commit's CI could evict the head's waiting release and then skip itself as stale.
# queue: max keeps every waiting run instead.
concurrency:
  group: production
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Cloud Run
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: durak-game
      REPOSITORY: durak-game
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Check that this commit is the head of main and passed CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-gate.sh

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.release == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.gate.outputs.release == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        if: steps.gate.outputs.release == 'true'
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --tag "${image}" .
          docker push "${image}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"

      # The build takes minutes; check again so a newer commit that landed meanwhile wins.
      - name: Check again that this commit is the head of main
        id: gate-again
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-gate.sh

      - name: Deploy
        if: steps.gate-again.outputs.release == 'true'
        run: DEPLOY_ONLY=true ./scripts/deploy-cloud-run.sh

      - name: Check the service serves this image with all traffic
        if: steps.gate-again.outputs.release == 'true'
        run: |
          service="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format=json)"
          image="$(jq -r '.spec.template.spec.containers[0].image' <<<"${service}")"
          latest_percent="$(jq -r '[.status.traffic[]? | select(.latestRevision == true) | .percent] | add // 0' <<<"${service}")"
          echo "image=${image} traffic to latest revision=${latest_percent}%"
          if [ "${image}" != "${IMAGE}" ] || [ "${latest_percent}" != "100" ]; then
            echo "::error::Cloud Run is not sending all traffic to the latest revision with ${IMAGE}."
            exit 1
          fi
          echo "SERVICE_URL=$(jq -r '.status.url' <<<"${service}")" >> "${GITHUB_ENV}"

      - name: Smoke test
        if: steps.gate-again.outputs.release == 'true'
        run: ./scripts/smoke-test.sh "${{ vars.PUBLIC_URL || env.SERVICE_URL }}"
